<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#030508">
  <meta name="description" content="AIRA — Sign in to your personal AI assistant.">
  <title>AIRA — Sign In</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/login.css">
  <script defer src="js/login.js"></script>
</head>

<body class="login-body">
  <div class="noise" aria-hidden="true"></div>

  <div class="login-backdrop">
    <div class="login-orbit-ring ring-1" aria-hidden="true"></div>
    <div class="login-orbit-ring ring-2" aria-hidden="true"></div>
    <div class="login-glow" aria-hidden="true"></div>
  </div>

  <header class="login-header">
    <a href="index.html" class="brand">
      <span class="brand-symbol">A</span>
      <span>AIRA<span class="brand-period">.</span></span>
    </a>
    <a href="index.html" class="login-back-link">
      <span>←</span> Back to home
    </a>
  </header>

  <main class="login-container">
    <div class="login-card">
      <div class="login-orb" aria-hidden="true">
        <div class="login-orb-core"></div>
      </div>

      <div class="login-heading">
        <span class="login-kicker">PERSONAL AI ASSISTANT</span>
        <h1 id="formTitle">Welcome back</h1>
        <p id="formSubtitle">Sign in to access your personal AIRA workspace.</p>
      </div>

      <div class="login-tabs" role="tablist">
        <button type="button" class="tab-btn active" id="tabSignIn">Sign In</button>
        <button type="button" class="tab-btn" id="tabSignUp">Create Account</button>
      </div>

      <!-- Social Logins -->
      <div class="social-login-group">
        <button type="button" class="social-btn google-btn" id="btnGoogle">
          <svg class="social-icon" viewBox="0 0 24 24" aria-hidden="true">
            <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
            <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
            <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/>
            <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/>
          </svg>
          <span>Continue with Google</span>
        </button>

        <button type="button" class="social-btn github-btn" id="btnGithub">
          <svg class="social-icon" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
            <path fill-rule="evenodd" clip-rule="evenodd" d="M12 2C6.477 2 2 6.484 2 12.017c0 4.425 2.865 8.18 6.839 9.504.5.092.682-.217.682-.483 0-.237-.008-.868-.013-1.703-2.782.605-3.369-1.343-3.369-1.343-.454-1.158-1.11-1.466-1.11-1.466-.908-.62.069-.608.069-.608 1.003.07 1.53 1.032 1.53 1.032.892 1.53 2.341 1.088 2.91.832.092-.647.35-1.088.636-1.338-2.22-.253-4.555-1.113-4.555-4.951 0-1.093.39-1.988 1.029-2.688-.103-.253-.446-1.272.098-2.65 0 0 .84-.27 2.75 1.026A9.564 9.564 0 0112 6.844c.85.004 1.705.115 2.504.337 1.909-1.296 2.747-1.027 2.747-1.027.546 1.379.202 2.398.1 2.651.64.7 1.028 1.595 1.028 2.688 0 3.848-2.339 4.695-4.566 4.943.359.309.678.92.678 1.855 0 1.338-.012 2.419-.012 2.747 0 .268.18.58.688.482A10.019 10.019 0 0022 12.017C22 6.484 17.522 2 12 2z"/>
          </svg>
          <span>Continue with GitHub</span>
        </button>
      </div>

      <div class="divider">
        <span>or sign in with email</span>
      </div>

      <form class="login-form" id="loginForm" action="index.html" method="get">
        <div class="form-group" id="groupName" style="display: none;">
          <label for="userName">Full Name</label>
          <div class="input-wrap">
            <span class="input-icon">👤</span>
            <input type="text" id="userName" name="userName" placeholder="Your Name" autocomplete="name">
          </div>
        </div>

        <div class="form-group">
          <label for="userEmail">Email address</label>
          <div class="input-wrap">
            <span class="input-icon">✉</span>
            <input type="email" id="userEmail" name="userEmail" placeholder="you@example.com" required autocomplete="email">
          </div>
        </div>

        <div class="form-group">
          <div class="label-row">
            <label for="userPassword">Password</label>
            <a href="#" class="forgot-link" id="linkForgot">Forgot password?</a>
          </div>
          <div class="input-wrap">
            <span class="input-icon">🔒</span>
            <input type="password" id="userPassword" name="userPassword" placeholder="••••••••••••" required autocomplete="current-password">
            <button type="button" class="btn-toggle-pw" id="btnTogglePw" aria-label="Toggle password visibility">
              <span id="eyeIcon">👁</span>
            </button>
          </div>
        </div>

        <div class="form-meta">
          <label class="remember-label">
            <input type="checkbox" checked id="rememberMe">
            <span>Remember me for 30 days</span>
          </label>
        </div>

        <button type="submit" class="button button-primary login-btn" id="btnSubmit">
          <span id="btnSubmitText">Sign In</span> <span class="arrow-icon">↗</span>
        </button>

        <div class="login-status-pill" id="loginStatus" style="display: none;">
          <span class="status-pulse"></span>
          <span id="statusText">Signing you in...</span>
        </div>
      </form>

      <div class="login-footer-switch">
        <span id="switchText">Don't have an account?</span>
        <button type="button" class="switch-link" id="btnSwitchMode">Create one</button>
      </div>
    </div>
  </main>

  <footer class="login-footer">
    <span>© 2027 AIRA PROJECT</span>
    <span>Privacy Policy · Terms of Service</span>
  </footer>
</body>
</html>
